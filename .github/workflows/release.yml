name: Build and publish KernelSU module

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read module metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version_code="${GITHUB_RUN_NUMBER}"
          version="1.0.${version_code}"
          id="$(sed -n 's/^id=//p' module.prop | head -n 1)"
          test -n "$version_code"
          test -n "$id"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Update module version
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
        run: |
          set -euo pipefail
          sed -i -E "s/^version=.*/version=${VERSION}/; s/^versionCode=.*/versionCode=${VERSION_CODE}/" module.prop
          grep -q "^version=${VERSION}$" module.prop
          grep -q "^versionCode=${VERSION_CODE}$" module.prop

      - name: Build module ZIP
        run: sh build.sh "dist/${{ steps.metadata.outputs.id }}.zip"

      - name: Generate update metadata
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          MODULE_ID: ${{ steps.metadata.outputs.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          changelog_url="https://v4.gh-proxy.org/https://github.com/${REPOSITORY}/raw/main/changelog.md"
          changelog_entry="## [${VERSION}](https://github.com/${REPOSITORY}/releases/tag/v${VERSION})\n\n- Automatic update for commit ${GITHUB_SHA::7}.\n"
          if [ -f changelog.md ]; then
            printf '%b\n' "${changelog_entry}" > changelog.md.tmp
            cat changelog.md >> changelog.md.tmp
            mv changelog.md.tmp changelog.md
          else
            printf '%b\n' "${changelog_entry}" > changelog.md
          fi
          cat > update.json <<EOF
          {
            "version": "${VERSION}",
            "versionCode": ${VERSION_CODE},
            "zipUrl": "https://v4.gh-proxy.org/https://github.com/${REPOSITORY}/releases/download/v${VERSION}/${MODULE_ID}.zip",
            "changelog": "${changelog_url}"
          }
          EOF

      - name: Commit update metadata to repository
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json changelog.md
          if git diff --cached --quiet; then
            echo "update.json is already current."
          else
            git commit -m "chore: update metadata for v${VERSION}"
            git push
          fi

      - name: Publish GitHub Release

        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          MODULE_ID: ${{ steps.metadata.outputs.id }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$tag" "dist/${MODULE_ID}.zip" "update.json" \
            --title "$MODULE_ID $VERSION" \
            --generate-notes \
            --notes "KernelSU module version $VERSION (versionCode $VERSION_CODE)."
